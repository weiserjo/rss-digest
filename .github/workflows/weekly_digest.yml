name: Weekly RSS Digest

on:
  # TEMPORARY: moved to Wednesday to test whether the schedule fires on its
  # own now that the repo/workflow is past GitHub's new-repo scheduling
  # deprioritization window. Revert to '0 8 * * 1' (Monday) once confirmed.
  schedule:
    - cron: '0 8 * * 3'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (only 5 articles)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (generate but do not send email)'
        required: false
        type: boolean
        default: false

jobs:
  generate-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run digest workflow
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          if [ "${{ github.event.inputs.test_mode }}" == "true" ]; then
            uv run python src/main.py --test
          elif [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            uv run python src/main.py --dry-run
          else
            uv run python src/main.py
          fi

      - name: Upload digest HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-html-${{ github.run_number }}
          path: |
            digest_*.html
            digest.log
          retention-days: 30

      - name: Report status
        if: failure()
        run: |
          echo "::error::Digest workflow failed. Check logs for details."
          cat digest.log || echo "Log file not found"

[project]
name = "rss-digest"
version = "0.2.0"
description = "Simplified automated system to fetch, analyze, and deliver weekly digests from Crossref journal metadata (stateless, no database)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.12.0",
    "python-dotenv>=1.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
